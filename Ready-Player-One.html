/* Layout: one full-bleed canvas holding a letterboxed 16:9 stage, CRT overlay on top, start screen as an HTML layer */
:root{
  --void:#020208;
  --ink:#e9ecff;
  --dim:#8d93b8;
  --cyan:#5ff1ff;
  --amber:#ffd36b;
  --rose:#ff4f9a;
  --f-pixel:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  --f-text:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink)}
body.nocursor{cursor:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.crt{position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);}
.vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%);}
#start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.box{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:760px}
.eyebrow{margin:0;font:12px/1.4 var(--f-pixel);letter-spacing:.12em;color:var(--dim)}
#start h1{margin:0;font:clamp(18px,4.2vw,40px)/1.3 var(--f-pixel);text-wrap:balance;
  background:linear-gradient(90deg,#ffe08a,#ff7a59 55%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 #2a7bff)}
.sub{margin:0;font:600 clamp(15px,2vw,20px)/1.4 var(--f-text);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
button{font:12px/1.2 var(--f-pixel);letter-spacing:.06em;padding:16px 20px;border-radius:0;cursor:pointer;
  border:3px solid var(--amber);background:transparent;color:var(--amber)}
button.primary{background:var(--amber);color:var(--void);animation:blink 1.1s steps(2,start) infinite}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.keys{margin:0;font:500 14px/1.6 var(--f-text);color:var(--dim);max-width:62ch}
.keys b{color:var(--ink);font-weight:600}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){button.primary{animation:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="Animación de apertura: de los videojuegos a la inteligencia artificial"></canvas>
<div class="crt"></div>
<div class="vig"></div>
<div id="start">
  <div class="box">
    <p class="eyebrow">APERTURA DE LA CHARLA</p>
    <h1>READY PLAYER ONE</h1>
    <p class="sub">de los videojuegos a la inteligencia artificial</p>
    <div class="btns">
      <button id="go" class="primary">▶ PRESIONA START</button>
      <button id="gofs">START EN PANTALLA COMPLETA</button>
    </div>
    <p class="keys"><b>Espacio</b> pausa · <b>← →</b> o el control de diapositivas cambian de escena · <b>F</b> pantalla completa · <b>M</b> sonido · <b>R</b> repetir</p>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FP='"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
const FT='"Chakra Petch", "Segoe UI", system-ui, sans-serif';

/* ---------- stage ---------- */
let W=0,H=0,DPR=1,SX=0,SY=0,SW=0,SH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(W/H>16/9){SH=H;SW=H*16/9}else{SW=W;SH=W*9/16}
  SX=(W-SW)/2;SY=(H-SH)/2;
}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const hash=i=>{const s=Math.sin(i*12.9898)*43758.5453;return s-Math.floor(s)};
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function ramp(stops,t){t=clamp(t,0,1)*(stops.length-1);const i=Math.min(stops.length-2,Math.floor(t)),k=t-i;const a=hex(stops[i]),b=hex(stops[i+1]);return[0,1,2].map(n=>Math.round(lerp(a[n],b[n],k)))}
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const f=(size,fam=FP,w='')=>`${w} ${Math.max(6,size).toFixed(1)}px ${fam}`.trim();
const fmt=n=>Math.round(n).toLocaleString('es-CO');
function txt(s,x,y,font,color,align='center',base='middle'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y)}
function fitTxt(s,x,y,size,fam,w,color,maxW){ctx.font=f(size,fam,w);const mw=ctx.measureText(s).width;if(mw>maxW)size*=maxW/mw;txt(s,x,y,f(size,fam,w),color)}
function makeBuf(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return{c,x:c.getContext('2d'),w,h}}
function blitGlow(b,glow=.35){
  ctx.imageSmoothingEnabled=false;ctx.drawImage(b.c,0,0,SW,SH);
  if(glow>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=glow;ctx.imageSmoothingEnabled=true;
    ctx.drawImage(b.c,-SW*.004,-SH*.004,SW*1.008,SH*1.008);ctx.restore()}
}

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null,muted=false;const VOL=.22;
function initAudio(){
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:VOL;
    const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,dur,type='square',vol=.2,when=0,slide=null){
  if(!AC)return;const t=AC.currentTime+when;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

const SCENES=[boot,pong,blocks,para,poly,gpu,neural,title];

/* ---------- engine ---------- */
let state='idle',sceneIdx=0,sceneT=0,paused=false,lastStep=-1,last=performance.now();
function goto(i){
  i=clamp(i,0,SCENES.length-1);sceneIdx=i;sceneT=0;lastStep=-1;shakeT=0;flashT=0;
  const sc=SCENES[i];sc.init&&sc.init();sc.enter&&sc.enter();

}
function yearNow(){
  const sc=SCENES[sceneIdx];const val=sc.yr?sc.yr(sceneT):sc.year;const pv=SCENES[sceneIdx-1];
  if(pv&&pv.year&&sceneT<.9){const pe=pv.yr?pv.yr(pv.dur):pv.year;return Math.round(lerp(pe,val,easeOut(sceneT/.9)))}
  return Math.round(val);
}
function drawHUD(){

  const s=Math.max(3,SW*.008);

  txt('AÑO',SW*.965,SH*.05,f(SW*.01),'rgba(233,236,255,.6)','right');
  txt(String(yearNow()),SW*.965,SH*.095,f(SW*.026),'#ffd36b','right');
}
function drawCaption(sc,t){
  const a=clamp((t-.35)/.4,0,1)*clamp((sc.dur-t)/.3,0,1);if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createLinearGradient(0,SH*.72,0,SH);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.78)');
  ctx.fillStyle=g;ctx.fillRect(0,SH*.72,SW,SH*.28);
  fitTxt(sc.head,SW/2,SH*.86,SW*.017,FP,'',sc.accent,SW*.9);
  let sub=sc.sub,sa=1;if(sc.sub2){if(t>sc.sub2At)sub=sc.sub2;sa=clamp(Math.abs(t-sc.sub2At)/.25,0,1)}
  ctx.globalAlpha=a*sa;fitTxt(sub,SW/2,SH*.925,SW*.02,FT,'600','#f2f3ff',SW*.92);
  ctx.restore();
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(SX,SY);ctx.beginPath();ctx.rect(0,0,SW,SH);ctx.clip();
  if(state==='idle'){drawStars(dt,'#05040f')}
  else{
    const sc=SCENES[sceneIdx],p=sc.dur?clamp(sceneT/sc.dur,0,1):0,ddt=paused?0:dt;
    ctx.save();
    if(shakeT>0&&!RM){const m=SW*.008*(shakeT/.35);ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m)}
    sc.draw(sceneT,p,ddt);ctx.restore();
    shakeT=Math.max(0,shakeT-ddt);
    if(flashT>0){ctx.fillStyle=`rgba(255,255,255,${(flashT/.25)*(RM?.2:.8)})`;ctx.fillRect(0,0,SW,SH);flashT=Math.max(0,flashT-ddt)}
    if(sc.head)drawCaption(sc,sceneT);

    if(sc.static!==false&&sceneT<.32)drawStatic(1-sceneT/.32);
    if(paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,SW,SH);txt('PAUSA',SW/2,SH*.47,f(SW*.03),'#ffd36b');
      txt('Espacio para continuar',SW/2,SH*.55,f(SW*.016,FT,'600'),'#e9ecff')}
  }
  ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'&&!paused){
    sceneT+=dt;const sc=SCENES[sceneIdx];
    const si=Math.floor(sceneT*8);if(si!==lastStep){lastStep=si;sc.step&&sc.step(si,sc.dur?clamp(sceneT/sc.dur,0,1):0,sceneT)}
    if(sc.dur&&sceneT>=sc.dur)goto(sceneIdx+1);
  }
  render(dt);requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
const startEl=document.getElementById('start');
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function start(fs){
  if(!AC)initAudio();else AC.resume&&AC.resume();
  if(fs){try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
  startEl.hidden=true;state='play';paused=false;cv.focus&&cv.focus();goto(0);wake();
}
document.getElementById('go').addEventListener('click',()=>start(false));
document.getElementById('gofs').addEventListener('click',()=>start(true));
addEventListener('keydown',e=>{
  const k=e.key;

    if((k===' '||k==='Enter')&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){e.preventDefault();start(false)}
    if(k==='f'||k==='F')toggleFS();
    return;
  }
  if(k===' '){e.preventDefault();paused=!paused}

let idleTimer=null;
